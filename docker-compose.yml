# OptiFauna - entorno completo con Docker Compose.
#
# Levanta dos contenedores:
#   - db  : PostgreSQL con la base 'optifauna' ya creada.
#   - api : el backend NestJS, compilado desde el Dockerfile.
#
# Las credenciales NO van escritas aqui: se leen de variables de entorno
# (del archivo .env del proyecto, que no se sube a git) y, si no existen,
# usan los valores por defecto genericos de abajo. Para produccion se
# definen variables reales en el entorno, nunca en este archivo.
#
# Uso:
#   1) copia el ejemplo:   cp .env.example .env   (en Windows: copy .env.example .env)
#   2) levanta todo:       docker compose up --build
#      en segundo plano:   docker compose up -d --build
#   3) detener:            docker compose down
#      borrar tambien los datos: docker compose down -v
#
# La API queda en  http://localhost:3000  y Swagger en  http://localhost:3000/api
#
# Nota: el puerto de la base se publica en 5433 del host (no 5432) para no
# chocar con un PostgreSQL instalado localmente. Entre contenedores la API se
# conecta por el nombre de servicio 'db' en el puerto interno 5432.

services:
  db:
    image: postgres:16-alpine
    container_name: optifauna-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-optifauna}
    ports:
      - '5433:5432'
    volumes:
      - optifauna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-optifauna}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: optifauna-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-optifauna}
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  optifauna_pgdata:
